name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# CI builds do not contact the database, but Better Auth validates these values
# while Next.js collects route data during the production build.
env:
  BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  BETTER_AUTH_URL: http://localhost:3000
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm exec playwright test
      - run: pnpm run test:coverage
